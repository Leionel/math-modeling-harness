<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Harness Console · 数模工作台</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fafafa;
        --panel: #fff;
        --soft: #f3f5f8;
        --ink: #202938;
        --muted: #647083;
        --line: #e3e7ed;
        --blue: #2563eb;
        --green: #17734d;
        --red: #b73737;
        --amber: #91620c;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #141922;
        --panel: #1b222d;
        --soft: #252e3b;
        --ink: #e7ecf5;
        --muted: #a7b3c5;
        --line: #354151;
        --blue: #8bb3ff;
        --green: #6bd5a1;
        --red: #ff9393;
        --amber: #e7bf69;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.65 "Segoe UI Variable",
          "Segoe UI",
          "Microsoft YaHei",
          sans-serif;
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 7px 12px;
        color: var(--ink);
      }
      button:hover {
        background: var(--soft);
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      summary:focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 3px;
      }
      a {
        color: var(--blue);
      }
      code,
      pre {
        font:
          12px/1.65 Consolas,
          monospace;
        overflow-wrap: anywhere;
      }
      pre {
        white-space: pre-wrap;
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      h1 {
        font-size: 26px;
        line-height: 1.4;
        font-weight: 650;
      }
      h2 {
        font-size: 17px;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .shell {
        display: grid;
        grid-template-columns: 208px minmax(0, 1fr);
        min-height: 100vh;
      }
      .sidebar {
        background: var(--panel);
        border-right: 1px solid var(--line);
        padding: 28px 18px;
        position: sticky;
        top: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 26px;
      }
      .brand {
        font-size: 18px;
        font-weight: 650;
      }
      .brand small {
        display: block;
        font-weight: 400;
        font-size: 11px;
        letter-spacing: 1.5px;
        color: var(--muted);
      }
      #project {
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .nav {
        display: grid;
        gap: 6px;
      }
      .nav button {
        text-align: left;
        border-color: transparent;
        padding: 11px 14px;
      }
      .nav button[aria-current="page"] {
        color: var(--blue);
        background: var(--soft);
        font-weight: 600;
      }
      .sidebar footer {
        margin-top: auto;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--line);
        padding: 17px 30px;
        background: var(--panel);
        gap: 12px;
      }
      .tools {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 26px;
        padding: 32px;
        max-width: 1600px;
        margin: auto;
      }
      .main {
        min-width: 0;
      }
      .inspector {
        min-width: 0;
        border-left: 1px solid var(--line);
        padding-left: 24px;
      }
      .inspector h2 {
        margin-bottom: 20px;
      }
      .inspector dt {
        color: var(--muted);
        font-size: 12px;
        margin-top: 18px;
      }
      .inspector dd {
        margin: 4px 0;
        overflow-wrap: anywhere;
      }
      .page-head {
        margin-bottom: 24px;
      }
      .eyebrow {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .badge {
        display: inline-block;
        font-size: 12px;
        padding: 3px 8px;
        border-radius: 5px;
        background: var(--soft);
        color: var(--muted);
      }
      .passed,
      .current {
        color: var(--green);
      }
      .blocked,
      .ERROR,
      .stale {
        color: var(--red);
      }
      .rail {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 8px;
        margin: 20px 0 26px;
      }
      .step {
        border-top: 3px solid var(--line);
        padding: 9px 4px;
        min-width: 0;
      }
      .step.passed {
        border-color: var(--green);
      }
      .step.blocked {
        border-color: var(--amber);
        color: var(--amber);
      }
      .step b {
        display: block;
        font-size: 13px;
      }
      .step small {
        font-size: 11px;
        color: var(--muted);
      }
      .action {
        background: var(--panel);
        border: 1px solid var(--line);
        border-left: 3px solid var(--blue);
        border-radius: 9px;
        padding: 24px;
        margin-bottom: 28px;
      }
      .action p {
        margin: 12px 0 18px;
        overflow-wrap: anywhere;
      }
      .primary {
        background: var(--blue);
        border-color: var(--blue);
        color: var(--panel);
      }
      .primary:hover {
        opacity: 0.88;
        background: var(--blue);
      }
      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 20px 0 12px;
        gap: 12px;
      }
      .rows {
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--panel);
        overflow: hidden;
      }
      .row {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        border-radius: 0;
        border-bottom: 1px solid var(--line);
        padding: 16px 18px;
        background: transparent;
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row[aria-pressed="true"] {
        background: var(--soft);
        box-shadow: inset 3px 0 var(--blue);
      }
      .row-title {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .row p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 5px;
        overflow-wrap: anywhere;
      }
      .empty {
        padding: 28px;
        border: 1px dashed var(--line);
        border-radius: 9px;
        color: var(--muted);
        background: var(--panel);
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin: 24px 0;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
        background: var(--panel);
        text-align: left;
      }
      .card strong {
        display: block;
        font-size: 23px;
        margin: 6px 0;
      }
      .card[aria-pressed="true"] {
        border-color: var(--blue);
      }
      .search {
        display: flex;
        gap: 10px;
        margin-bottom: 14px;
      }
      .search input {
        width: 100%;
        min-width: 0;
        background: var(--panel);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 9px 12px;
      }
      .preview {
        margin-top: 18px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 16px;
      }
      .preview img {
        display: block;
        max-width: 100%;
        max-height: 500px;
        margin: 16px auto;
      }
      .preview iframe {
        width: 100%;
        height: 560px;
        border: 0;
        margin-top: 16px;
      }
      .error-banner {
        border: 1px solid var(--red);
        border-radius: 7px;
        color: var(--red);
        padding: 16px;
        margin-bottom: 20px;
        overflow-wrap: anywhere;
      }
      details {
        margin-top: 24px;
      }
      summary {
        cursor: pointer;
        color: var(--muted);
      }
      .links {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 16px;
      }
      #notice {
        min-height: 20px;
        color: var(--muted);
        font-size: 12px;
      }
      #connection {
        color: var(--muted);
        font-size: 12px;
      }
      #content {
        overflow-wrap: anywhere;
      }
      @media (max-width: 1150px) {
        .workspace {
          grid-template-columns: minmax(0, 1fr);
          padding: 24px;
        }
        .inspector {
          border-left: 0;
          border-top: 1px solid var(--line);
          padding: 24px 0;
        }
        .cards {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 700px) {
        .shell {
          grid-template-columns: minmax(0, 1fr);
        }
        .shell > div {
          min-width: 0;
        }
        .sidebar {
          min-width: 0;
        }
        .sidebar {
          position: static;
          height: auto;
          padding: 16px;
          gap: 14px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .nav {
          display: flex;
          overflow-x: auto;
        }
        .nav button {
          white-space: nowrap;
        }
        .sidebar footer,
        #project {
          display: none;
        }
        .topbar {
          padding: 12px 16px;
          align-items: flex-start;
          flex-direction: column;
        }
        .workspace {
          padding: 20px 16px;
        }
        .rail {
          grid-template-columns: repeat(3, 1fr);
        }
        h1 {
          font-size: 22px;
        }
        .cards {
          gap: 8px;
        }
        .action {
          padding: 18px;
        }
        .preview iframe {
          height: 400px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand" id="brand"></div>
        <div id="project"></div>
        <nav class="nav" id="nav" aria-label="Workspace"></nav>
        <footer class="small muted" id="readonly"></footer>
      </aside>
      <div>
        <header class="topbar">
          <span id="breadcrumb"></span>
          <div class="tools">
            <span id="connection" role="status"></span
            ><button id="refresh"></button><button id="pause"></button
            ><button id="theme"></button><button id="lang"></button>
          </div>
        </header>
        <div class="workspace">
          <main class="main">
            <div id="error" role="alert"></div>
            <div id="content"></div>
            <div id="notice" role="status"></div>
          </main>
          <aside class="inspector" id="inspector" aria-label="Details"></aside>
        </div>
      </div>
    </div>
    <script>
      const $ = (id) => document.getElementById(id),
        esc = (v) =>
          String(v ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
      let lang = "zh",
        theme = "light",
        view = "overview",
        data = null,
        selection = null,
        filter = "all",
        query = "",
        paused = false,
        busy = false,
        lastFetch = null,
        transportError = "",
        previewBlob = null;
      try {
        lang = localStorage.getItem("harness-console-lang") || "zh";
        theme = localStorage.getItem("harness-console-theme") || "light";
      } catch {}
      const tr = (zh, en) => (lang === "zh" ? zh : en);
      const words = {
        overview: ["概览", "Overview"],
        model: ["题目与模型", "Problem & models"],
        runs: ["实验与验证", "Runs & reviews"],
        paper: ["论文与图表", "Paper & figures"],
        results: ["成果中心", "Deliverables"],
        settings: ["环境与来源", "Environment & sources"],
      };
      const labels = {
        passed: ["已通过", "Passed"],
        blocked: ["受阻", "Blocked"],
        locked: ["尚未检查", "Not evaluated"],
        unknown: ["未知", "Unknown"],
        unverified: ["未验证", "Unverified"],
        current_package: ["当前写作包已绑定（不代表论文质量通过）", "Current bound writer package"],
        matched: ["已定位", "Located"],
        missing: ["缺失", "Missing"],
        ambiguous: ["多处匹配，需核对", "Multiple matches"],
        "no registered writer package": ["尚未登记写作证据包", "no registered writer package"],
        "no registered claimable PASS frozen results": ["尚未登记可供写作的冻结结果", "no registered claimable PASS frozen results"],
        "model authoring source changed": ["模型作者源已改变，需要重新编译并验证", "model authoring source changed"],
        boundary: ["流程边界", "Boundary"],
        current: ["当前版本", "Current"],
        stale: ["已过期", "Stale"],
        not_run: ["未生成", "Not produced"],
        READY: ["已检查 Gate 通过", "Observed gates pass"],
        BLOCKED: ["当前流程受阻", "Blocked"],
        ERROR: ["状态读取失败", "Status unavailable"],
        LEGACY: ["旧版状态，需迁移", "Legacy state"],
        PENDING_HUMAN: ["待人工确认", "Human decision pending"],
      };
      const word = (k) =>
        labels[k]?.[lang === "zh" ? 0 : 1] ||
        String(k ?? tr("未知", "Unknown"));
      const names = {
        M1: ["模型规划", "Model planning"],
        P1: ["执行准备", "Execution readiness"],
        P2: ["结果验证", "Result validation"],
        W1: ["论文组织", "Paper planning"],
        W2: ["论文评审", "Paper review"],
        S1: ["交付检查", "Submission check"],
      };
      const name = (k) => names[k]?.[lang === "zh" ? 0 : 1] || k;
      const artifactURL = (a, download = false) =>
        "/api/artifact?id=" +
        encodeURIComponent(a.artifact_id) +
        (download ? "&download=1" : "");
      const category = (a) => {
        const p = String(a.path).toLowerCase(),
          r = String(a.role);
        return /\.(png|jpe?g|webp|svg)$/.test(p) || /figure/.test(r)
          ? "figures"
          : /\.(tex|pdf)$/.test(p) || /paper/.test(r)
            ? "paper"
            : /submission/.test(r)
              ? "submission"
              : "evidence";
      };
      const groups = {
        paper: ["论文", "Paper"],
        figures: ["图表", "Figures"],
        evidence: ["代码与证据", "Code & evidence"],
        submission: ["提交材料", "Submission"],
      };
      function chrome() {
        document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
        document.documentElement.dataset.theme =
          theme === "system"
            ? matchMedia("(prefers-color-scheme:dark)").matches
              ? "dark"
              : "light"
            : theme;
        $("brand").innerHTML =
          tr("数模工作台", "Modeling workspace") +
          "<small>EVIDENCE HARNESS</small>";
        $("readonly").textContent = tr(
          "只读工作台 · 决策由 Harness 记录",
          "Read-only · decisions recorded by Harness",
        );
        $("nav").innerHTML = Object.keys(words)
          .map(
            (k) =>
              `<button data-view="${k}" aria-current="${view === k ? "page" : "false"}">${esc(words[k][lang === "zh" ? 0 : 1])}</button>`,
          )
          .join("");
        $("breadcrumb").textContent = words[view][lang === "zh" ? 0 : 1];
        $("refresh").textContent = tr("刷新", "Refresh");
        $("pause").textContent = paused
          ? tr("继续刷新", "Resume")
          : tr("暂停刷新", "Pause");
        $("theme").textContent = tr("主题：", "Theme: ") + theme;
        $("lang").textContent = lang === "zh" ? "EN" : "中文";
        $("connection").textContent = transportError
          ? tr("连接失败，显示上次快照", "Connection failed; previous snapshot")
          : paused
            ? tr("已暂停", "Paused")
            : lastFetch
              ? tr("最近重算 ", "Recomputed ") +
                new Date(lastFetch).toLocaleTimeString()
              : tr("读取中…", "Loading…");
        $("project").textContent = data?.project_root || "";
      }
      function head(title, sub) {
        return `<div class="page-head"><div class="eyebrow">${esc(data.run_id || "—")} · ${esc(word(data.gate_status))}</div><h1>${title}</h1><p class="muted" style="margin-top:10px">${sub}</p></div>`;
      }
      function list(rows, fn) {
        return rows.length
          ? `<div class="rows">${rows.map(fn).join("")}</div>`
          : `<div class="empty">${tr("暂无记录。生成并登记对应产物后，这里会展示实际证据。", "No records. Produce and register artifacts to show evidence here.")}</div>`;
      }
      function row(kind, id, title, status, path) {
        return `<button class="row" data-kind="${kind}" data-id="${esc(id)}" aria-pressed="${selection?.kind === kind && String(selection.id) === String(id)}"><div class="row-title"><b>${esc(title)}</b><span class="small muted">${esc(status)}</span></div><p><code>${esc(path || "—")}</code></p></button>`;
      }
      function render() {
        chrome();
        $("error").innerHTML = transportError
          ? `<div class="error-banner">${esc(transportError)}</div>`
          : "";
        if (!data) {
          $("content").innerHTML =
            `<div class="empty">${tr("正在读取项目状态。", "Reading project state.")}</div>`;
          return;
        }
        if (data.status_errors?.length)
          $("error").innerHTML +=
            `<div class="error-banner">${esc(word(data.gate_status))}<br>${data.status_errors.map(esc).join("<br>")}</div>`;
        if (data.source_errors?.length)
          $("error").innerHTML += `<div class="error-banner">${tr("源文件目录读取失败：", "Source catalog failed: ")}${data.source_errors.map(esc).join("<br>")}</div>`;
        const arts = data.artifacts || [],
          blocked = String(data.first_blocked_gate || "").toUpperCase();
        if (view === "overview") {
          $("content").innerHTML =
            head(
              data.gate_status === "ERROR"
                ? tr("先恢复项目状态读取", "Restore project state first")
                : blocked
                  ? tr("先完成", "Complete ") + esc(name(blocked))
                  : esc(word(data.gate_status)),
              tr(
                "当前工作和后续人工确认分开呈现。",
                "Current work and later human decisions are shown separately.",
              ),
            ) +
            `<div class="rail">${(data.gates || [])
              .filter((g) => names[g.gate])
              .map(
                (g) =>
                  `<div class="step ${esc(g.state)}"><b>${esc(name(g.gate))}</b><small>${g.gate} · ${esc(word(g.state))}</small></div>`,
              )
              .join(
                "",
              )}</div><section class="action"><div class="eyebrow">${tr("当前工作", "Current work")} · ${esc(blocked || data.stage || "—")}</div><h2>${esc(word(data.gate_status))}</h2><p>${esc(data.next_action || data.next_actions?.[0] || tr("没有可推导的下一步，请检查来源。", "No next action available; inspect sources."))}</p><div class="tools"><button class="primary" data-copy="check">${tr("复制检查命令", "Copy check command")}</button><button data-view="results">${tr("浏览已有成果", "Browse deliverables")}</button></div></section><div class="section-head"><h2>${tr("需要处理", "Needs attention")}</h2><span class="muted small">${(data.blockers || []).length} ${tr("条 Gate 诊断", "gate diagnostics")}</span></div>` +
            list(data.blockers || [], (b, i) =>
              row(
                "issue",
                i,
                b.message,
                String(b.gate || "").toUpperCase(),
                b.next_action,
              ),
            ) +
            `<div class="section-head"><h2>${tr("待人工确认", "Pending human decisions")}</h2></div><p class="muted">${esc((data.pending_human_checkpoints || []).join(" · ") || tr("暂无待确认项", "None reported"))}</p><p class="muted small">${tr("先处理当前 Gate 的证据诊断；后续人工确认不代表现在应批准。", "Resolve current gate evidence first. Later decisions are not instructions to approve now.")}</p>`;
        } else if (view === "runs") {
          $("content").innerHTML =
            head(
              tr("执行与验证证据", "Execution & review evidence"),
              tr(
                "回执、选用结果和评审报告按真实记录展示。",
                "Receipts, selection and reviews from recorded evidence.",
              ),
            ) +
            `<div class="section-head"><h2>${tr("执行回执", "Execution receipts")}</h2></div>` +
            list(data.receipts || [], (r, i) =>
              row(
                "receipt",
                i,
                r.receipt_id,
                `${r.stage || "—"} · ${tr("退出码", "exit")} ${r.exit_code ?? "—"}${r.selected ? " · " + tr("选用", "selected") : ""}`,
                r.path,
              ),
            ) +
            `<div class="section-head"><h2>${tr("评审", "Reviews")}</h2></div>` +
            list(data.reviews || [], (r, i) =>
              row(
                "review",
                i,
                r.perspective,
                `${r.verdict || "—"} · ${r.independence_level || "—"}`,
                r.path,
              ),
            ) +
            `<div class="section-head"><h2>${tr("最近活动", "Recent activity")}</h2></div>` +
            list(
              [...(data.timeline || [])].reverse(),
              (e) =>
                `<div class="row"><b>${esc(e.label)}</b><p>${esc(e.at || "—")} · ${esc(e.detail)}</p></div>`,
            );
        } else if (view === "model") {
          const workbench = data.question_workbench || {};
          $("content").innerHTML =
            head(
              tr("题目与模型", "Problem & models"),
              tr(
                "按明确的小问标识查看任务、模型、执行产物、验证和论文边界。",
                "Explicit question links connect tasks, models, outputs, validation and paper boundaries.",
              ),
            ) +
            list(workbench.questions || [], (q) =>
              row(
                "question",
                q.question_id,
                q.question_id.toUpperCase() + " · " + q.task,
                q.model_source_stale
                  ? tr("作者源已变更", "Source changed")
                  : tr("合同声明", "Contract declaration"),
                q.outputs.join(" · "),
              ),
            ) +
            `<div class="section-head"><h2>${tr("作者文件", "Authoring sources")}</h2></div>` +
            sourceRows(["authoring", "reasoning"]);
          if (workbench.errors?.length)
            $("content").innerHTML +=
              `<div class="error-banner">${workbench.errors.map(esc).join("<br>")}</div>`;
        } else if (view === "settings") {
          $("content").innerHTML =
            head(
              tr("环境与事实来源", "Environment & fact sources"),
              tr(
                "自动模式是授权声明；这里不表示后台执行器正在运行。",
                "Auto mode declares authorization; it does not indicate a running executor.",
              ),
            ) +
            `<div class="rows"><div class="row">${tr("项目根目录", "Project root")}<p><code>${esc(data.project_root)}</code></p></div><div class="row">${tr("当前阶段 / 模式", "Stage / mode")}<p>${esc(data.stage || "—")} / ${esc(data.operator_mode || "—")}</p></div><div class="row">${tr("状态退出码", "Status exit code")}<p>${esc(data.status_exit_code ?? "—")}</p></div>${(data.sources || []).map((s) => `<div class="row"><code>${esc(s)}</code></div>`).join("")}</div><details><summary>${tr("完整机器快照", "Full machine snapshot")}</summary><pre>${esc(JSON.stringify(data, null, 2))}</pre></details>`;
        } else {
          let visible = arts
            .filter((a) =>
              view === "paper"
                ? ["paper", "figures"].includes(category(a))
                : view === "model"
                  ? /model|problem|data_contract|implementation/.test(a.role)
                  : filter === "all" || category(a) === filter,
            )
            .filter((a) =>
              [a.path, a.role, a.artifact_id]
                .join(" ")
                .toLowerCase()
                .includes(query.toLowerCase()),
            );
          $("content").innerHTML =
            head(
              words[view][lang === "zh" ? 0 : 1],
              tr(
                "已登记产物的新鲜度与冻结状态分别展示。文件存在不等于验收通过。",
                "Freshness and lifecycle are separate. File existence is not acceptance.",
              ),
            ) +
            (view === "results"
              ? `<div class="cards">${Object.keys(groups)
                  .map(
                    (k) =>
                      `<button class="card" data-filter="${k}" aria-pressed="${filter === k}"><span class="muted">${groups[k][lang === "zh" ? 0 : 1]}</span><strong>${arts.filter((a) => category(a) === k).length}</strong><span class="small muted">${tr("已登记", "registered")}</span></button>`,
                  )
                  .join("")}</div>`
              : "") +
            `<div class="search"><input id="search" aria-label="${tr("搜索产物", "Search artifacts")}" placeholder="${tr("搜索名称、角色或路径", "Search name, role or path")}" value="${esc(query)}">${filter !== "all" ? `<button data-filter="all">${tr("全部", "All")}</button>` : ""}</div>` +
            list(visible, (a) =>
              row(
                "artifact",
                a.artifact_id,
                a.role,
                word(a.freshness) + " · " + a.lifecycle,
                a.path,
              ),
            ) +
            `<p class="muted small" style="margin-top:16px">${tr("逐问成果需要显式题目—模型—验证—论文关联；缺少关联时保留未知，不按文件名推测。", "Question-level outcomes require explicit problem–model–validation–paper links; missing links remain unknown.")}</p>`;
          if (data.artifact_errors?.length)
            $("content").innerHTML +=
              `<div class="error-banner">${data.artifact_errors.map(esc).join("<br>")}</div>`;
        }
        if (view === "runs")
          $("content").innerHTML +=
            `<div class="section-head"><h2>${tr("执行日志", "Execution logs")}</h2></div>` +
            sourceRows(["log"]) +
            `<div class="section-head"><h2>${tr("待审版本绑定", "Reviewed version bindings")}</h2></div>` +
            sourceRows(["reviewed_version"]);
        if (view === "paper")
          $("content").innerHTML +=
            `<div class="section-head"><h2>${tr("实际论文源", "Actual paper sources")}</h2></div>` +
            sourceRows(["paper_source"]);
        inspect();
      }
      function sourceRows(kinds) {
        return list(
          (data.user_sources || []).filter((s) => kinds.includes(s.kind)),
          (s) =>
            row(
              "source",
              s.source_id,
              s.path,
              s.exists ? word(s.freshness) : tr("尚未生成", "Not produced"),
              s.source_id,
            ),
        );
      }
      function inspect() {
        let selected = selection;
        if (!selected && data.blockers?.length)
          selected = { kind: "issue", id: 0 };
        let body = "",
          title = tr("工作详情", "Work details");
        if (selected?.kind === "issue") {
          const b = data.blockers?.[selected.id];
          if (b)
            body = `<dl><dt>Gate</dt><dd>${esc(String(b.gate).toUpperCase())}</dd><dt>${tr("中文解释", "Explanation (Chinese)")}</dt><dd>${esc(b.action?.summary_zh || b.message)}<p>${esc(b.action?.corrective_action_zh || "")}</p></dd><dt>${tr("诊断原文", "Reported diagnostic")}</dt><dd>${esc(b.message)}</dd><dt>${tr("修复方向", "Repair direction")}</dt><dd>${esc(b.next_action)}</dd></dl><div class="links"><button data-copy="check">${tr("复制复查命令", "Copy recheck command")}</button><button data-copy="posix">${tr("复制 bash 复查", "Copy bash recheck")}</button>${b.action?.target_source_id ? `<button data-kind="source" data-id="${esc(b.action.target_source_id)}">${tr("查看目标源文件", "View target source")}</button><button data-copy="compile">${tr("复制编译命令", "Copy compile command")}</button>` : ""}</div>`;
        } else if (selected?.kind === "source") {
          const s = (data.user_sources || []).find(
            (s) => s.source_id === selected.id,
          );
          title = tr("源文件与版本", "Source & version");
          if (s) {
            body = `<p><code>${esc(s.path)}</code></p><p>${esc(word(s.freshness))}</p><div class="links"><button id="load-source">${tr("读取内容", "Read content")}</button><button data-copy="path">${tr("复制路径", "Copy path")}</button></div><p class="small muted">${tr("只读预览；日志有长度限制并做敏感信息遮盖。", "Read-only; logs are bounded and redacted.")}</p><div id="source-content"></div>`;
          }
        } else if (selected?.kind === "question") {
          const q = data.question_workbench?.questions?.find(
            (q) => q.question_id === selected.id,
          );
          title = q
            ? q.question_id.toUpperCase() + tr(" 工作详情", " task details")
            : tr("小问不可用", "Question unavailable");
          if (q) {
            body = `<h2>${esc(q.task)}</h2><dl><dt>${tr("合同模型", "Declared models")}</dt><dd>${q.models.map((m) => `<b>${esc(m.name)}</b><p>${esc(m.algorithm)} · ${esc(m.rationale)}</p>`).join("")}</dd><dt>${tr("实际执行产物", "Executed outputs")}</dt><dd>${q.executed_outputs.map((o) => `<p><code>${esc(o.path)}</code><br>${esc(o.stage)} · ${esc(word(o.freshness))} · ${esc(o.receipt_id)}</p>`).join("") || tr("尚无明确关联的执行产物", "No explicitly linked outputs")}</dd><dt>${tr("验证义务", "Validation obligations")}</dt><dd>${q.validation_obligations.map((v) => `<p><b>${esc(v.obligation_id)} · ${esc(v.status)}</b><br>${esc(v.method)}${v.evidence ? `<br><code>${esc(v.evidence.path)}</code>` : ""}</p>`).join("")}</dd><dt>${tr("可用于论文的证据", "Writer evidence")}</dt><dd>${esc(word(q.writer_eligibility))}<p>${q.writer_limits.map((limit) => esc(word(limit))).join("<br>")}</p></dd><dt>${tr("实际正文位置", "Actual source locations")}</dt><dd>${q.paper_locations.map((l) => `<p>${esc(l.marker)} · ${esc(word(l.state))}<br>${l.matches.map((m) => `${esc(m.path)}:${m.line}`).join("<br>")}</p>`).join("") || tr("尚无已声明的定位符", "No declared locators")}</dd><dt>${tr("源码与 PDF 绑定", "Source/PDF binding")}</dt><dd>${esc(word(data.question_workbench.paper_binding?.status || "unverified"))}</dd></dl><details><summary>${tr("论证与来源原始投影", "Argument and source projection")}</summary><pre>${esc(JSON.stringify(q, null, 2))}</pre></details>`;
          }
        } else if (selected?.kind === "artifact") {
          const a = data.artifacts.find((a) => a.artifact_id === selected.id);
          if (a) {
            title = tr("成果详情", "Artifact details");
            body = `<dl><dt>${tr("路径", "Path")}</dt><dd><code>${esc(a.path)}</code></dd><dt>${tr("新鲜度 / 生命周期", "Freshness / lifecycle")}</dt><dd>${esc(word(a.freshness))} · ${esc(a.lifecycle)}</dd><dt>${tr("生成器 / 回执", "Producer / receipt")}</dt><dd><code>${esc(a.producer_id || "—")}<br>${esc(a.producer_receipt_id || tr("未绑定", "Not bound"))}</code></dd><dt>${tr("变化原因", "Drift reason")}</dt><dd>${esc(a.drift_reason || "—")}</dd><dt>${tr("上游证据", "Upstream evidence")}</dt><dd>${
              (a.dependencies || [])
                .map((id) => {
                  const dep = data.artifacts.find((x) => x.artifact_id === id);
                  return row(
                    "artifact",
                    id,
                    dep?.role || id,
                    "",
                    dep?.path || tr("关联产物未找到", "Dependency unavailable"),
                  );
                })
                .join("") || tr("没有已登记依赖", "No registered dependencies")
            }</dd></dl><div class="links"><a href="${artifactURL(a, true)}" download>${tr("下载文件", "Download file")}</a></div><p class="small muted">${tr("尚未生成的文件返回 404。", "Missing files return 404.")}</p><details><summary>${tr("机器记录", "Machine record")}</summary><pre>${esc(JSON.stringify(a, null, 2))}</pre></details>`;
            const ext = String(a.path).toLowerCase();
            if (/\.(png|jpe?g|webp|pdf)$/.test(ext)) {
              $("content").insertAdjacentHTML(
                "beforeend",
                `<section class="preview"><h2>${tr("文件预览", "File preview")}</h2><p class="small muted"><code>${esc(a.path)}</code></p><button id="open-preview">${tr("加载预览", "Load preview")}</button><div id="preview-body"></div></section>`,
              );
              $("open-preview").onclick = async () => {
                try {
                  const res = await fetch(artifactURL(a));
                  if (!res.ok) throw Error((await res.json()).error);
                  const blob = await res.blob();
                  if (previewBlob) URL.revokeObjectURL(previewBlob);
                  previewBlob = URL.createObjectURL(blob);
                  $("preview-body").innerHTML = /\.pdf$/.test(ext)
                    ? `<iframe title="PDF preview" src="${previewBlob}"></iframe>`
                    : `<img alt="${esc(a.role)}" src="${previewBlob}">`;
                } catch (e) {
                  $("preview-body").textContent =
                    tr("无法预览：", "Preview unavailable: ") + e.message;
                }
              };
            }
          }
        } else if (selected) {
          const r =
            selected.kind === "receipt"
              ? data.receipts?.[selected.id]
              : data.reviews?.[selected.id];
          if (r) {
            title = tr("证据记录", "Evidence record");
            body = `<pre>${esc(JSON.stringify(r, null, 2))}</pre>`;
          }
        }
        $("inspector").innerHTML =
          `<h2>${title}</h2>${body || `<p class="muted">${tr("选择诊断、回执或成果，查看来源和依赖。", "Select a diagnostic, receipt or artifact to inspect provenance.")}</p>`}<details><summary>${tr("事实来源", "Fact sources")}</summary><pre>${esc((data.sources || []).join("\n"))}</pre></details>`;
        if ($("load-source"))
          $("load-source").onclick = async () => {
            const output = $("source-content");
            try {
              const response = await fetch(
                "/api/source?id=" + encodeURIComponent(selected.id),
              );
              const result = await response.json();
              if (!response.ok) throw Error(result.error);
              output.innerHTML = `<p class="muted">${esc(result.unavailable_reason || (result.truncated ? tr("内容已截断", "Content truncated") : ""))}</p><pre>${esc(result.text)}</pre>`;
            } catch (e) {
              output.textContent =
                tr("读取失败：", "Read failed: ") + e.message;
            }
          };
      }
      function checkCommand() {
        const gate = String(data?.first_blocked_gate || "").toUpperCase(),
          root = String(data?.project_root || "").replace(/'/g, "''");
        return gate && names[gate]
          ? `harness check ${gate} --project '${root}' --json`
          : `harness status --project '${root}' --json`;
      }
      document.addEventListener("click", async (e) => {
        const b = e.target.closest(
          "[data-view],[data-kind],[data-filter],[data-copy]",
        );
        if (!b) return;
        if (b.dataset.copy) {
          let copiedText = "";
          try {
            const selectedIssue =
              selection?.kind === "issue"
                ? data.blockers?.[selection.id]
                : data.blockers?.[0];
            const action = selectedIssue?.action;
            const source = (data.user_sources || []).find(
              (s) => s.source_id === selection?.id,
            );
            const text =
              b.dataset.copy === "posix"
                ? action?.command?.posix || checkCommand()
                : b.dataset.copy === "compile"
                  ? action?.compile_command?.powershell || checkCommand()
                  : b.dataset.copy === "path"
                    ? data.project_root.replace(/[\\/]$/, "") +
                      "/" +
                      source.path
                    : action?.command?.powershell || checkCommand();
            copiedText = text;
            await navigator.clipboard.writeText(text);
            $("notice").textContent = tr(
              "已复制" + (b.dataset.copy === "path" ? "文件路径" : b.dataset.copy === "posix" ? " bash 命令" : " PowerShell 命令"),
              b.dataset.copy === "path" ? "File path copied" : b.dataset.copy === "posix" ? "bash command copied" : "PowerShell command copied",
            );
          } catch {
            $("notice").textContent = copiedText || checkCommand();
          }
          return;
        }
        if (b.dataset.view) {
          view = b.dataset.view;
          selection = null;
          filter = "all";
          query = "";
        } else if (b.dataset.filter) {
          filter = b.dataset.filter;
          selection = null;
        } else selection = { kind: b.dataset.kind, id: b.dataset.id };
        if (previewBlob) {
          URL.revokeObjectURL(previewBlob);
          previewBlob = null;
        }
        render();
      });
      document.addEventListener("input", (e) => {
        if (e.target.id === "search") {
          query = e.target.value;
          const start = e.target.selectionStart;
          render();
          $("search").focus();
          $("search").setSelectionRange(start, start);
        }
      });
      async function refresh() {
        if (busy) return;
        busy = true;
        try {
          const response = await fetch("/api/snapshot");
          const value = await response.json();
          if (!response.ok || value.error)
            throw Error(value.error || response.status);
          data = value;
          lastFetch = Date.now();
          transportError = "";
          render();
        } catch (e) {
          transportError =
            tr("快照请求失败：", "Snapshot request failed: ") + e.message;
          render();
        } finally {
          busy = false;
        }
      }
      $("refresh").onclick = refresh;
      $("pause").onclick = () => {
        paused = !paused;
        chrome();
      };
      $("lang").onclick = () => {
        lang = lang === "zh" ? "en" : "zh";
        try {
          localStorage.setItem("harness-console-lang", lang);
        } catch {}
        render();
      };
      $("theme").onclick = () => {
        theme =
          theme === "light" ? "dark" : theme === "dark" ? "system" : "light";
        try {
          localStorage.setItem("harness-console-theme", theme);
        } catch {}
        render();
      };
      matchMedia("(prefers-color-scheme:dark)").addEventListener(
        "change",
        () => {
          if (theme === "system") chrome();
        },
      );
      render();
      refresh();
      setInterval(() => {
        if (!paused && !selection) refresh();
      }, 10000);
    </script>
  </body>
</html>
